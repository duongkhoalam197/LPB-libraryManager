<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Manager - Import Book</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background-color: #f7f7f7;
    }

    h1 {
      margin-bottom: 16px;
    }

    form {
      background-color: #fff;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
      max-width: 400px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 6px 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    #result {
      margin-top: 24px;
      white-space: pre-wrap;
      background-color: #222;
      color: #eee;
      padding: 12px;
      border-radius: 4px;
      max-width: 800px;
      overflow-x: auto;
    }

    .success {
      border-left: 4px solid #4caf50;
    }

    .error {
      border-left: 4px solid #f44336;
    }

    /* Bảng list books */
    #booksSection {
      margin-top: 16px;
      margin-bottom: 32px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 800px;
      background-color: #fff;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    tr:nth-child(even) {
      background-color: #fafafa;
    }

    .no-data {
      padding: 8px;
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>
<h1>Library Manager</h1>



<h2>Import Book</h2>
<form id="importForm">
  <div class="form-group">
    <label for="title">Title</label>
    <input id="title" name="title" required>
  </div>

  <div class="form-group">
    <label for="author">Author</label>
    <input id="author" name="author" required>
  </div>

  <div class="form-group">
    <label for="price">Price</label>
    <input id="price" name="price" type="number" step="0.01" required>
  </div>

  <div class="form-group">
    <label for="categoryId">Category ID</label>
    <input id="categoryId" name="categoryId" type="number" required>
  </div>

  <button type="submit">Import</button>
  <button type="button" id="listBtn">List Books</button>
</form>

<!-- ĐẨY BẢNG LÊN TRÊN -->
<div id="booksSection">
  <h2>Books List</h2>
  <div id="booksTableWrapper">
    <!-- Bảng sẽ được JS render vào đây -->
  </div>
</div>

<h2>API Response (for debug)</h2>
<div id="result"></div>

<script src="js/app.js"></script>
</body>
</html>
